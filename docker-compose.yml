version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-ai-api
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - API_URL=https://openrouter.ai/api/v1
      - CURRENT_MODEL=deepseek/deepseek-v4-flash:free
      - DEBUG=false
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - support-ai-network
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: support-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - support-ai-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  support-ai-network:
    driver: bridge
